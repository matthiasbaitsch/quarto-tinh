name: Beispiele rendern

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schriften
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-roboto fonts-firacode

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::gt
            any::knitr
            any::reactable
            any::rmarkdown
            any::tidyverse

      # Für die Notebook-Beispiele (engine: julia), QuartoNotebookRunner installiert Quarto selbst
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      # Quarto ist auf dem Runner vorinstalliert
      - name: TinyTeX
        run: |
          quarto --version
          quarto install tinytex --no-prompt

      - name: Rendern
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: __output

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
