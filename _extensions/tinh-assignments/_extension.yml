title: tinh-assignments
author: Matthias Baitsch
version: 0.5.0
quarto-required: ">=1.8.0"

contributes:
  formats:
    common:
      # Makros aus tinh-macros (\SI, \R, ...), Bilder zentrieren aus tinh-common
      filters:
        - ../tinh-macros/macros.lua
        - ../tinh-common/center-images.lua
      fig-align: center
      crossref:
        exr-title: "Aufgabe"
        exr-prefix: "Aufgabe"
      reference-section-title: "Literatur"
    html:
      lang: de
      css:
        - tinh-assignments.css
      default-image-extension: svg
    typst:
      lang: de
      citeproc: true
      mainfont: Libertinus Serif
      page-numbering: false
      margin:
        x: 2.5cm
        y: 2.5cm
      logo:
        location: right-top
        padding: 1.25cm 1.25cm
      template-partials:
        - typst-template.typ
      include-before-body:
        - exercise.typ
      

